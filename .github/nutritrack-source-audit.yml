name: NutriTrack Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compare V2.5.1 and V8 source packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nt/v251 /tmp/nt/v8 audit
          unzip -q NutriTrack-V2.5.1-Source-Fixed.zip -d /tmp/nt/v251
          unzip -q NutriTrack-Android-V8-Integrated.zip -d /tmp/nt/v8

          find /tmp/nt/v251 -type f -printf '%P\t%s bytes\n' | sort > audit/v251-files.txt
          find /tmp/nt/v8 -type f -printf '%P\t%s bytes\n' | sort > audit/v8-files.txt

          {
            echo "=== V2.5.1 SOURCE FILES ==="
            cat audit/v251-files.txt
            echo
            echo "=== V8 SOURCE FILES ==="
            cat audit/v8-files.txt
            echo
            echo "=== V2.5.1 FEATURE MARKERS ==="
            grep -RniE "tesseract|ocr|barcode|qr.?code|zxing|referenceFoods|customFoods|editFood|deleteFood|backup|restore|FoodDatabase" /tmp/nt/v251 \
              --include='*.java' --include='*.kt' --include='*.html' --include='*.gradle' --include='*.xml' | head -n 500 || true
            echo
            echo "=== V8 FEATURE MARKERS ==="
            grep -RniE "tesseract|ocr|barcode|qr.?code|zxing|referenceFoods|customFoods|editFood|deleteFood|backup|restore|FoodDatabase" /tmp/nt/v8 \
              --include='*.java' --include='*.kt' --include='*.html' --include='*.gradle' --include='*.xml' --include='*.json' | head -n 500 || true
          } > audit/audit-report.txt

          echo "V2.5.1 file count: $(wc -l < audit/v251-files.txt)"
          echo "V8 file count: $(wc -l < audit/v8-files.txt)"
          cat audit/audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-Source-Audit
          path: audit/
          if-no-files-found: error
          retention-days: 14
