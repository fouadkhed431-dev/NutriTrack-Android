name: Build NutriTrack 4.0.0 Complete Upgrade Release
on:
  workflow_dispatch:
  push:
    branches: [main, master, phase0/source-audit, release/nutritrack-4.0]
    paths:
      - 'NutriTrack-Android-V2.4.0-Source.zip'
      - 'patches/apply-phase0-data-safety.py'
      - 'tests/phase0-data-safety.test.cjs'
      - 'patches/apply-ultimate-upgrade.py'
      - 'patches/completion-upgrade.py.gz.b64'
      - 'patches/apply-ai-assistant.py'
      - 'tests/complete-features.test.cjs'
      - 'patches/apply-quality-upgrade.py'
      - 'patches/apply-v4-complete-upgrade.py'
      - 'tests/v4-complete-upgrade.test.cjs'
      - 'tests/quality-upgrade.test.cjs'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  # Integrated NutriTrack 4.0 complete upgrade pipeline.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Extract authoritative source archive
        run: |
          mkdir -p /tmp/nutritrack-source
          unzip -q NutriTrack-Android-V2.4.0-Source.zip -d /tmp/nutritrack-source
          cp -a /tmp/nutritrack-source/NutriTrack-Android-main/. .
      - name: Apply Phase 0 data-safety patch
        run: |
          python3 patches/apply-phase0-data-safety.py
          python3 patches/apply-ultimate-upgrade.py
          base64 -d patches/completion-upgrade.py.gz.b64 | gzip -d > patches/apply-completion-upgrade.py
          python3 - <<'PYROOT'
          from pathlib import Path
          p=Path('patches/apply-completion-upgrade.py')
          s=p.read_text(encoding='utf-8')
          s=chr(10).join('root=Path(__file__).resolve().parent.parent' if line.startswith('root=Path(__file__).resolve().') else line for line in s.splitlines())+chr(10)
          p.write_text(s,encoding='utf-8')
          PYROOT
          python3 patches/apply-completion-upgrade.py
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          old='favorites:[],foodOverrides:{},hiddenReferenceFoods:[]'
          if old in s:
              s=s.replace(old,'favorites:[],planner:[],foodOverrides:{},hiddenReferenceFoods:[]',1)
          elif 'planner:[]' not in s:
              raise SystemExit('Planner state default marker missing')
          old='if(obj.foodOverrides!==undefined&&!plain(obj.foodOverrides))throw new Error("Invalid food overrides");'
          if old in s:
              s=s.replace(old,'if(obj.planner!==undefined&&!Array.isArray(obj.planner))throw new Error("Invalid planner");' + chr(10) + ' ' + old,1)
          p.write_text(s,encoding='utf-8')
          PYCODE
          python3 patches/apply-quality-upgrade.py
          python3 patches/apply-v4-complete-upgrade.py
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'NutriTrack 4.0' app/src/main/assets/manifest.webmanifest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: |
          node tests/phase0-data-safety.test.cjs
          node tests/complete-features.test.cjs
          node tests/quality-upgrade.test.cjs
          node tests/v4-complete-upgrade.test.cjs
      - name: Verify source database and version
        run: |
          grep -q "versionCode 14" app/build.gradle
          grep -q "versionName '4.0.0'" app/build.gradle
          python3 - <<'PYCODE'
          import json, pathlib
          s=pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          marker='referenceFoods='
          i=s.index(marker)+len(marker)
          start=s.index('[',i)
          depth=0; quoted=False; escaped=False
          for j,ch in enumerate(s[start:],start):
              if quoted:
                  if escaped: escaped=False
                  elif ch == chr(92): escaped=True
                  elif ch=='"': quoted=False
              else:
                  if ch=='"': quoted=True
                  elif ch=='[': depth+=1
                  elif ch==']':
                      depth-=1
                      if depth==0: end=j+1; break
          foods=json.loads(s[start:end])
          assert len(foods)==608, f'Expected 608 foods, got {len(foods)}'
          print(f'Validated {len(foods)} reference foods')
          PYCODE
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK metadata and backup policy
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.nutritrack.app'.*versionCode='14'.*versionName='4.0.0'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'allowBackup.*0x0'
      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-4.0.0-Complete-Upgrade
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
