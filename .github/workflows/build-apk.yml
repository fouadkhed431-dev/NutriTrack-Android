name: Build NutriTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NutriTrack-V2.5.1-Source-Fixed.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract the complete NutriTrack source package
        run: |
          test -s NutriTrack-V2.5.1-Source-Fixed.zip
          mkdir -p /tmp/nutritrack-source
          unzip -q NutriTrack-V2.5.1-Source-Fixed.zip -d /tmp/nutritrack-source
          test -d /tmp/nutritrack-source/NutriTrack-Android-main
          cp -a /tmp/nutritrack-source/NutriTrack-Android-main/. .

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify release inputs
        run: |
          grep -q "versionCode 8" app/build.gradle
          grep -q "versionName '2.5.1'" app/build.gradle
          test -s data/Food_Composition_Tables_Expanded.xlsx
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          python3 - <<'PYCODE'
          import json, pathlib
          s = pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          marker = 'referenceFoods='
          start = s.index(marker) + len(marker)
          foods, _ = json.JSONDecoder().raw_decode(s[start:].lstrip())
          assert len(foods) == 536, f'Expected 536 foods, got {len(foods)}'
          for term in ['Blueberries', 'Persimmon', 'Shish barak', 'Barazik', 'كيوي', 'مفروكة بالقشطة']:
              assert term in s, f'Missing expected search item: {term}'
          print(f'Validated {len(foods)} reference foods and required search examples')
          PYCODE

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.nutritrack.app'.*versionCode='8'.*versionName='2.5.1'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-V2.5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
