name: Build NutriTrack V8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - NutriTrack-Android-V8-Integrated.zip
      - .github/workflows/build-v8-apk.yml

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check and extract V8 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="NutriTrack-Android-V8-Integrated.zip"
          test -s "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/nutritrack-v8"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nutritrack-v8"

          SOURCE_DIR="$RUNNER_TEMP/nutritrack-v8/NutriTrack-Android-main"
          test -d "$SOURCE_DIR"
          cp -a "$SOURCE_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Verify Android project and V8 database
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/nutritrack/app/MainActivity.java
          test -s DATABASE_V8_IMPORT.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-V8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
