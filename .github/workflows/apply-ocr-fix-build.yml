name: Apply NutriTrack OCR Fix and Build APK

on:
  push:
    paths:
      - '.github/scripts/fix_nutritrack_ocr.py'
      - '.github/workflows/apply-ocr-fix-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply OCR source fix
        run: python3 .github/scripts/fix_nutritrack_ocr.py
      - name: Commit corrected app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix nutrition OCR row matching and stale scan values"
            git push
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-OCR-Fix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
